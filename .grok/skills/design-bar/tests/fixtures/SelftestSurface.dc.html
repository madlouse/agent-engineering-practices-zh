<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>自测画板：首屏、色面、点按区域、字号</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}
a:hover{text-decoration:underline}
a:active,button:active{opacity:.8}
button:hover{opacity:.9}
.hit{position:relative}
.hit::after{content:"";position:absolute;inset:-12px -10px}
.hit-dead::after{pointer-events:none}
:root{--ground:#f4f2ec;--ink:#1c1d19;--panel:#1c1d19}
[data-theme="dark"]{--ground:#121310;--ink:#ecebe4;--panel:#22231f}
</style>
</helmet>
<div data-theme="light" data-first-screen style="position: relative; width: 390px; min-height: 600px; background: var(--ground); color: var(--ink); font-family: sans-serif;">
<header style="padding: 12px 20px;"><h1 style="margin: 0; font-size: 24px; line-height: 1.2;">每周一练</h1></header>
<sc-if value="{{ emptyBand }}"><div style="height: 260px;"></div></sc-if>
<sc-if value="{{ motionBand }}"><div style="position: relative; height: 260px;"><canvas aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%;"></canvas></div></sc-if>
<p style="margin: 8px 0; padding: 0 20px; font-size: 16px;">练什么、练多久，都替你排好了。</p>
<div style="display: flex; height: 320px;"><div aria-label="左面" style="flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 12px 20px; background: var(--ground);"><span style="font-size: 16px;">周二</span><span style="font-size: 16px;">周四</span><span style="font-size: 16px;">周六</span></div><div aria-label="右面" style="flex: 1; background: {{ faceB }}; box-shadow: {{ faceShadow }};"></div></div>
<sc-if value="{{ shortLinks }}"><nav aria-label="面包屑" style="padding: 0 20px;"><a href="#mind" style="display: inline-block; min-width: 44px; height: 28px; line-height: 28px; font-size: 16px;">看清</a></nav></sc-if>
<sc-if value="{{ proseLink }}"><p style="margin: 8px 0; padding: 0 20px; font-size: 16px;">读完这一篇以后可以接着看<a href="#log">更新记录</a>，里面写了每次改动。</p></sc-if>
<sc-if value="{{ shortProse }}"><p style="margin: 8px 0; padding: 0 20px; font-size: 16px;">见<a href="#log">更新记录</a>。</p></sc-if>
<sc-if value="{{ divLink }}"><div style="margin: 8px 0; padding: 0 20px; font-size: 16px;">读完这一篇以后可以接着看<a href="#doc">文档</a>，里面写了每次改动。</div></sc-if>
<sc-if value="{{ rowLink }}"><ul style="margin: 8px 0; padding: 0 20px; list-style: none; font-size: 16px;"><li><a href="#row">标题链接</a> 后面跟着一段比较长的说明文字，不是一句话中间的链接</li></ul></sc-if>
<sc-if value="{{ cellLink }}"><table style="margin: 8px 20px; font-size: 16px;"><tr><td>读完这一篇以后可以接着看<a href="#more">更多</a>，里面写了每次改动。</td></tr></table></sc-if>
<sc-if value="{{ tooSmall }}"><div style="padding: 0 20px;"><button type="button" aria-label="关闭提示" style="width: 16px; height: 16px; padding: 0; border: 0; background: var(--ink);"></button></div></sc-if>
<sc-if value="{{ manySizes }}"><p style="margin: 0; padding: 0 20px;"><span style="font-size: 11px;">一</span><span style="font-size: 12px;">二</span><span style="font-size: 13px;">三</span><span style="font-size: 14px;">四</span><span style="font-size: 15px;">五</span><span style="font-size: 17px;">六</span><span style="font-size: 18px;">七</span><span style="font-size: 19px;">八</span><span style="font-size: 20px;">九</span></p></sc-if>
<footer style="padding: 0 20px;">
<sc-if value="{{ tallLink }}"><a href="#about" style="display: inline-block; min-width: 44px; height: 44px; line-height: 44px; font-size: 16px;">关于</a></sc-if>
<sc-if value="{{ shortLinks }}"><a href="#about" style="font-size: 14px;">关于</a></sc-if>
<sc-if value="{{ grownHit }}"><a class="hit" href="#rights" style="display: inline-block; margin: 14px 12px; font-size: 14px; line-height: 20px;">版权</a></sc-if>
<sc-if value="{{ deadHit }}"><a class="hit hit-dead" href="#rights" style="display: inline-block; margin: 14px 12px; font-size: 14px; line-height: 20px;">版权</a></sc-if>
<sc-if value="{{ footerProse }}"><p style="margin: 0; font-size: 16px;">继续使用就表示你同意我们的<a href="#terms">条款</a>，可以随时停用。</p></sc-if>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"case": {"editor": "enum", "options": ["好的", "空白带", "动效带", "色面分不开", "深色色面分不开", "链接太矮", "句中链接", "可点太小", "热区撑大", "字号太多", "短句链接", "块里的句中链接", "行标题链接", "表格里的句中链接", "页脚里的句子", "热区点不到", "色面有描边"], "default": "好的"}}'>
class Component extends DCLogic { renderVals() {
  const c = this.props.case;
  return { emptyBand: c === '空白带', motionBand: c === '动效带', faceShadow: c === '色面有描边' ? 'inset 0 0 0 1px var(--ink)' : 'none', faceB: (c === '色面分不开' || c === '色面有描边') ? '#e4e1d8' : c === '深色色面分不开' ? 'var(--panel)' : 'var(--ink)',
    shortLinks: c === '链接太矮', tallLink: !['链接太矮', '热区撑大', '热区点不到', '页脚里的句子'].includes(c), shortProse: c === '短句链接', divLink: c === '块里的句中链接', rowLink: c === '行标题链接', cellLink: c === '表格里的句中链接', footerProse: c === '页脚里的句子', deadHit: c === '热区点不到', proseLink: c === '句中链接', tooSmall: c === '可点太小', grownHit: c === '热区撑大', manySizes: c === '字号太多' };
} }
</script>
</body>
</html>
