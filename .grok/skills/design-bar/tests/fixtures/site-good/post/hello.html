<h1>第一篇：为什么先写清出处</h1>
<p>发布 <time datetime="2026-11-01">2026-11-01</time>，更新 <time datetime="2026-11-02">2026-11-02</time></p>
<h2>出处是给核对用的</h2>
<p>一个数字后面跟着出处，读的人可以点过去看原文；替人读的 Agent 也可以。没有出处的数字，只能信或者不信。</p>
<h2>日期也是出处的一部分</h2>
<p>同一句话，去年说和今年说不是一回事。发布日期和更新日期分开写，机器读得到，就不会把旧结论当新结论转述。</p>
