  <header class="vc-read-head">
    <h1 id="art-title" class="vc-type-title-2-serif" lang="{{contentLang}}">{{c.title}}</h1>
    <p class="vc-type-lead vc-read-col" lang="{{contentLang}}">{{c.dek}}</p>
    <div class="vc-meta vc-read-wide">
      <dl class="vc-meta-row" aria-label="{{u.metaWho}}">
        <div><dt>{{u.dtAuthor}}</dt><dd>{{u.author}}</dd></div>
        <div><dt>{{u.dtOriginal}}</dt><dd><time datetime="2026-07-29">{{u.dOriginal}}</time> · <a href="{{u.srcHref}}">{{u.readOriginal}}</a></dd></div>
        <div><dt>{{u.dtPublished}}</dt><dd><time datetime="2026-10-31">{{u.dPublished}}</time></dd></div>
      </dl>
      <dl class="vc-meta-row" aria-label="{{u.metaCheck}}">
        <div><dt>{{u.dtChecked}}</dt><dd><time datetime="2026-11-04">{{u.dChecked}}</time></dd></div>
        <div><dt>{{u.dtApplies}}</dt><dd>{{u.applies}}</dd></div>
        <div><dt>{{u.dtRights}}</dt><dd>{{u.rights}}</dd></div>
        <div data-origin="ai"><dt>{{u.dtOrigin}}</dt><dd>{{u.origin}}</dd></div>
        <div><dt>{{u.dtLength}}</dt><dd>{{length}}</dd></div>
      </dl>
    </div>
  </header>
