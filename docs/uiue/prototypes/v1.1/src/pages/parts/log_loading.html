  <sc-if value="{{isSlow}}" hint-placeholder-val="{{ false }}">
    <div class="vc-loading-slow" role="status"><p>{{g.loading}}</p><button type="button" class="btn vc-btn-quiet">{{u.retry}}</button></div>
  </sc-if>
  <h1 class="vc-sr-only">{{g.loading}}</h1>
  <div class="vc-loading" aria-hidden="true">
    <span class="vc-skeleton" style="width: 62%; height: var(--space-7);"></span>
    <span class="vc-skeleton vc-read-col" style="width: 100%; height: var(--space-5);"></span>
    <span class="vc-skeleton vc-read-col" style="width: 76%; height: var(--space-5);"></span>
    <span class="vc-skeleton vc-read-wide" style="width: 100%; height: var(--space-8); margin-top: var(--space-3);"></span>
    <span class="vc-skeleton vc-read-col" style="width: 100%; height: var(--space-4); margin-top: var(--space-6);"></span>
    <span class="vc-skeleton vc-read-col" style="width: 100%; height: var(--space-4);"></span>
    <span class="vc-skeleton vc-read-col" style="width: 64%; height: var(--space-4);"></span>
  </div>
